name: Build

on:
  push:
    branches: [main]
  pull_request:

# Build checks only need to read the code (pull requests from forks run untrusted code).
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: swift --version

      - name: Compile (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build app bundle
        run: ./scripts/build-app.sh release

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Volume-Mixer-app
          path: build/Volume Mixer.app
          retention-days: 7
