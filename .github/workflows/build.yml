name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Compile (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build app bundle
        run: ./scripts/build-app.sh release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Volume-Mixer-app
          path: build/Volume Mixer.app
          retention-days: 7
